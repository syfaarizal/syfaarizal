name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          template: classic
          base: header, banner, repositories, stars, commits, issues, prs, contributions
          plugin_languages: yes
          plugin_languages_limit: 8
          config_output: svg

      - name: Commit SVG files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-metrics.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update GitHub metrics SVG [skip ci]"
          git push
