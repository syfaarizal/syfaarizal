name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Stats SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          template: classic
          base: header, banner, repositories, stars, commits, issues, prs, contributions
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: "#563efe"
          plugin_lines: yes
          plugin_lines_delay: 30
          config_output: svg
          output_action: none
          filename: github-stats.svg

      - name: Generate Top Languages SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          template: classic
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_colors: "#563efe"
          plugin_languages_sections: dominant
          config_output: svg
          output_action: none
          filename: top-languages.svg

      - name: Generate Achievements SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_output: svg
          output_action: none
          filename: github-achievements.svg

      - name: Commit generated SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-stats.svg top-languages.svg github-achievements.svg
          git diff --staged --quiet || git commit -m "chore: update top languages SVG [skip ci]"
          git push
