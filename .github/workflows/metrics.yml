name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          template: classic
          base: header, banner, repositories, stars, commits, issues, prs, contributions
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: "#563efe"
          plugin_lines: yes
          config_output: svg
          filename: github-stats.svg

      - name: Commit Stats SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add github-stats.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update GitHub stats SVG [skip ci]"
          git push

  top-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: syfaarizal
          template: classic
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_colors: "#563efe"
          plugin_languages_sections: dominant
          config_output: svg
          filename: top-languages.svg

      - name: Commit Languages SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add top-languages.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update top languages SVG [skip ci]"
          git push
